<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Maç TV - Bağlanıyor...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: #0a0d14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #151b28, #0a0d14);
        }

        .portal-card {
            background: #121722;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #ff2a44, #ff5e62);
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 6px 20px rgba(255, 42, 68, 0.4);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
        }

        h2 span {
            color: #ff2a44;
        }

        p {
            color: #8e9bb0;
            font-size: 14px;
            line-height: 1.5;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 42, 68, 0.2);
            border-top: 3px solid #ff2a44;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .offline-box {
            display: none;
            background: rgba(255, 42, 68, 0.08);
            border: 1px solid rgba(255, 42, 68, 0.2);
            border-radius: 12px;
            padding: 14px;
            margin-top: 10px;
            font-size: 13px;
            color: #ff7385;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="logo-badge">⚽</div>
        <h2>CANLI<span>TV</span></h2>
        <p id="statusText">Canlı maç yayınına bağlanılıyor...</p>
        <div class="spinner" id="spinner"></div>

        <div class="offline-box" id="offlineBox">
            ⚠️ <strong>Yayın sunucusu kapalı</strong><br>
            Bilgisayarınızdaki <code>baslat.bat</code> dosyasını açtığınızda maç yayını otomatik olarak başlayacaktır.
        </div>
    </div>

    <script>
        const BRIDGE_URL = "https://ntfy.sh/macyayini_bridge_a0419/raw?poll=1";

        async function checkAndRedirect() {
            try {
                const res = await fetch(BRIDGE_URL);
                const text = await res.text();
                const lines = text.trim().split('\n').filter(Boolean);
                
                if (lines.length > 0) {
                    const latestUrl = lines[lines.length - 1];
                    if (latestUrl.startsWith("http")) {
                        document.getElementById('statusText').innerText = "Yayın hazır, açılıyor...";
                        window.location.replace(latestUrl);
                        return;
                    }
                }
            } catch (err) {
                console.log("Bağlantı bekleniyor...");
            }

            // Eğer tünel henüz açılmadıysa bekleme uyarısını göster
            setTimeout(() => {
                document.getElementById('offlineBox').style.display = 'block';
                document.getElementById('statusText').innerText = "Bilgisayarınızdaki tünel bekleniyor...";
            }, 2500);
        }

        checkAndRedirect();
        // 3 saniyede bir otomatik dene
        setInterval(checkAndRedirect, 3000);
    </script>
</body>
</html>
